<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="75" x2="800" y2="75" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="150" x2="800" y2="150" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="225" x2="800" y2="225" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="133" y1="0" x2="133" y2="450" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="266" y1="0" x2="266" y2="450" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="450" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="533" y1="0" x2="533" y2="450" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="666" y1="0" x2="666" y2="450" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Laptop / Monitor -->
  <rect x="240" y="100" width="320" height="200" rx="12" fill="url(#screen)" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="252" y="112" width="296" height="176" rx="6" fill="#0f172a"/>
  <!-- Code lines on screen -->
  <rect x="268" y="130" width="80" height="8" rx="3" fill="#3b82f6" opacity="0.9"/>
  <rect x="268" y="148" width="140" height="7" rx="3" fill="#60a5fa" opacity="0.6"/>
  <rect x="268" y="164" width="110" height="7" rx="3" fill="#818cf8" opacity="0.5"/>
  <rect x="280" y="180" width="90" height="7" rx="3" fill="#34d399" opacity="0.7"/>
  <rect x="280" y="196" width="120" height="7" rx="3" fill="#60a5fa" opacity="0.5"/>
  <rect x="268" y="212" width="70" height="7" rx="3" fill="#f472b6" opacity="0.6"/>
  <rect x="268" y="228" width="160" height="7" rx="3" fill="#60a5fa" opacity="0.4"/>
  <rect x="280" y="244" width="100" height="7" rx="3" fill="#34d399" opacity="0.6"/>
  <!-- Monitor stand -->
  <rect x="380" y="300" width="40" height="20" rx="3" fill="#1e40af"/>
  <rect x="350" y="318" width="100" height="10" rx="4" fill="#1d4ed8"/>
  <!-- Floating badges -->
  <rect x="580" y="120" width="120" height="50" rx="10" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="640" y="141" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">Python</text>
  <text x="640" y="158" text-anchor="middle" fill="#93c5fd" font-size="10" font-family="Arial">Programming</text>
  <rect x="100" y="180" width="110" height="50" rx="10" fill="rgba(99,102,241,0.2)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="155" y="200" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">Web Dev</text>
  <text x="155" y="218" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="Arial">Full Stack</text>
  <rect x="580" y="240" width="110" height="50" rx="10" fill="rgba(16,185,129,0.2)" stroke="#34d399" stroke-width="1.5"/>
  <text x="635" y="260" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">Data Science</text>
  <text x="635" y="278" text-anchor="middle" fill="#6ee7b7" font-size="10" font-family="Arial">Analytics</text>
  <!-- Title text -->
  <text x="400" y="385" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="22" font-family="Arial" font-weight="bold">Pelatihan Pemrograman &amp; Teknologi</text>
  <text x="400" y="410" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="14" font-family="Arial">Ahmad Dahlan Training Center</text>
</svg>
