<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="rgba(255,255,255,0.04)"/>
  <circle cx="150" cy="370" r="90" fill="rgba(255,255,255,0.04)"/>
  <!-- Whiteboard / presentation board -->
  <rect x="180" y="80" width="380" height="240" rx="10" fill="white" opacity="0.95"/>
  <rect x="180" y="80" width="380" height="28" rx="10" fill="#4f46e5"/>
  <rect x="180" y="94" width="380" height="14" fill="#4f46e5"/>
  <!-- Board content: chart bars -->
  <rect x="210" y="180" width="40" height="100" rx="4" fill="#818cf8" opacity="0.8"/>
  <rect x="265" y="155" width="40" height="125" rx="4" fill="#6366f1" opacity="0.9"/>
  <rect x="320" y="135" width="40" height="145" rx="4" fill="#4f46e5"/>
  <rect x="375" y="160" width="40" height="120" rx="4" fill="#6366f1" opacity="0.9"/>
  <rect x="430" y="145" width="40" height="135" rx="4" fill="#818cf8" opacity="0.8"/>
  <!-- Axis line -->
  <line x1="200" y1="280" x2="490" y2="280" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="200" y1="130" x2="200" y2="280" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Title on board -->
  <text x="370" y="105" text-anchor="middle" fill="white" font-size="13" font-family="Arial" font-weight="bold">Analisis Data &amp; Laporan</text>
  <!-- Pointer / person icon (simplified) -->
  <circle cx="620" cy="160" r="30" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <text x="620" y="168" text-anchor="middle" fill="white" font-size="28" font-family="Arial">👩‍🏫</text>
  <!-- Pointer line to board -->
  <line x1="595" y1="175" x2="490" y2="200" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Audience dots (simplified participants) -->
  <circle cx="190" cy="365" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="190" y="372" text-anchor="middle" font-size="20">👤</text>
  <circle cx="250" cy="365" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="250" y="372" text-anchor="middle" font-size="20">👤</text>
  <circle cx="310" cy="365" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="310" y="372" text-anchor="middle" font-size="20">👤</text>
  <circle cx="370" cy="365" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="370" y="372" text-anchor="middle" font-size="20">👤</text>
  <circle cx="430" cy="365" r="18" fill="rgba(255,255,255,0.15)"/>
  <text x="430" y="372" text-anchor="middle" font-size="20">👤</text>
  <!-- Bottom text -->
  <text x="400" y="415" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="22" font-family="Arial" font-weight="bold">Pelatihan Manajemen &amp; Bisnis</text>
  <text x="400" y="437" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="13" font-family="Arial">Ahmad Dahlan Training Center</text>
</svg>
